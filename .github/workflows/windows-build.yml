name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: install-qt-action-msvc2022-qt683-v3
          modules: "qtmultimedia qtwebsockets"
          aqtversion: "==3.3.*"
          py7zrversion: "==1.1.*"

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR",
            "-DQTNETWORKCHAT_DEFAULT_SERVER_HOST=qt.ziyuexc.top",
            "-DQTNETWORKCHAT_DEFAULT_SERVER_PORT=443",
            "-DQTNETWORKCHAT_DEFAULT_TRANSPORT=wss",
            "-DQTNETWORKCHAT_DEFAULT_WEBSOCKET_PATH=/ws",
            "-DQTNETWORKCHAT_DEFAULT_TLS=ON",
            "-DQTNETWORKCHAT_DEFAULT_TLS_VERIFY=ON",
            "-DQTNETWORKCHAT_E2E_ENABLE_PRODUCTION_CRYPTO=ON",
            "-DQTNETWORKCHAT_E2E_LINK_PRODUCTION_ADAPTER=ON"
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            throw "cmake configure failed with exit code $LASTEXITCODE"
          }

      - name: Build
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build/ci-logs | Out-Null
          $log = "build/ci-logs/build-release.log"
          $err = "build/ci-logs/build-release.err.log"
          $process = Start-Process -FilePath cmake -ArgumentList @("--build", "build", "--config", "Release", "--target", "QtNetworkChat", "message_serialization_test", "tls_security_test", "websocket_transport_test", "e2e_production_adapter_runtime_test") -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err -Wait -PassThru
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "cmake build failed with exit code $($process.ExitCode)"
          }

      - name: Test
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build/ci-logs | Out-Null
          $log = "build/ci-logs/ctest-release.log"
          $err = "build/ci-logs/ctest-release.err.log"
          $process = Start-Process -FilePath ctest -ArgumentList @("--test-dir", "build", "-C", "Release", "--output-on-failure", "-R", "^(QtNetworkChatExecutableExists|MessageSerializationRoundTrip|TlsSecurityPinning|WebSocketTransport|E2EProductionAdapterRuntime)$") -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err -Wait -PassThru
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "ctest failed with exit code $($process.ExitCode)"
          }

      - name: Package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build -Configuration Release -PackageDir dist -SkipBuild -FailOnMissingRuntime

      - name: Upload package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QtNetworkChat-win-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist/*.zip).FullName --clobber

      - name: Upload CI diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          path: |
            build/ci-logs/
            build/Testing/
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: |
          $summary = @()
          $summary += "## QtNetworkChat Windows Build"
          $summary += ""
          $summary += "| Field | Value |"
          $summary += "|---|---|"
          $summary += "| Commit | `$env:GITHUB_SHA` |"
          $summary += "| Event | `$env:GITHUB_EVENT_NAME` |"
          $summary += "| Ref | `$env:GITHUB_REF` |"
          $summary += "| Qt | `6.8.3 MSVC 2022 x64` |"
          $summary += "| Build step timeout | `30m` |"
          $summary += "| CTest step timeout | `20m` |"
          $summary += ""
          $summary += "Diagnostics are uploaded as `windows-build-diagnostics` when the job fails or is cancelled."
          $summary -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
