name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate maintained scripts and helpers
        shell: pwsh
        run: |
          ./scripts/test-script-maintenance.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: install-qt-action-msvc2022-qt683-v3
          modules: "qtmultimedia qtwebsockets"
          aqtversion: "==3.3.*"
          py7zrversion: "==1.1.*"

      - name: Prepare Chinese font for GUI tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/ci-fonts | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" -OutFile build/ci-fonts/NotoSansCJKsc-Regular.otf

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR",
            "-DQTNETWORKCHAT_DEFAULT_SERVER_HOST=qt.ziyuexc.top",
            "-DQTNETWORKCHAT_DEFAULT_SERVER_PORT=443",
            "-DQTNETWORKCHAT_DEFAULT_TRANSPORT=wss",
            "-DQTNETWORKCHAT_DEFAULT_WEBSOCKET_PATH=/ws",
            "-DQTNETWORKCHAT_DEFAULT_TLS=ON",
            "-DQTNETWORKCHAT_DEFAULT_TLS_VERIFY=ON",
            "-DQTNETWORKCHAT_E2E_ENABLE_PRODUCTION_CRYPTO=ON",
            "-DQTNETWORKCHAT_E2E_LINK_PRODUCTION_ADAPTER=ON"
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            throw "cmake configure failed with exit code $LASTEXITCODE"
          }

      - name: Build
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build/ci-logs | Out-Null
          $log = "build/ci-logs/build-release.log"
          $err = "build/ci-logs/build-release.err.log"
          $process = Start-Process -FilePath cmake -ArgumentList @("--build", "build", "--config", "Release", "--target", "QtNetworkChat", "qqnt_engine", "qqnt_engine_smoke_test", "qqnt_engine_end_to_end_test", "message_serialization_test", "tls_security_test", "tls_login_order_test", "websocket_transport_test", "login_window_gui_test", "group_info_panel_ui_test", "mainwindow_workflow_test", "mainwindow_extended_gui_test", "account_password_kdf_test", "offline_attachment_quota_test", "file_chunk_duplicate_ack_test", "file_transfer_cancel_test", "e2e_production_adapter_runtime_test", "e2e_private_message_delivery_test", "e2e_rollout_observability_exporter") -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err -Wait -PassThru
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "cmake build failed with exit code $($process.ExitCode)"
          }

      - name: Test
        shell: pwsh
        timeout-minutes: 20
        env:
          QTNETWORKCHAT_TEST_FONT: ${{ github.workspace }}/build/ci-fonts/NotoSansCJKsc-Regular.otf
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build/ci-logs | Out-Null
          $log = "build/ci-logs/ctest-release.log"
          $err = "build/ci-logs/ctest-release.err.log"
          $process = Start-Process -FilePath ctest -ArgumentList @("--test-dir", "build", "-C", "Release", "--output-on-failure", "-R", "^(QtNetworkChatExecutableExists|MessageSerializationRoundTrip|TlsSecurityPinning|TlsLoginFrameOrdering|WebSocketTransport|LoginWindowGuiInteraction|GroupInfoPanelUiInteraction|MainWindowNetworkWorkflow|MainWindowExtendedGui|AccountPasswordKdfMigration|OfflineAttachmentQuota|FileChunkDuplicateAckProtocol|FileTransferCancelProtocol|E2EProductionAdapterRuntime|E2ECryptoBackendConfig|E2ERolloutObservabilityEvidence|E2EPrivateMessageDelivery|QQNTEngineSmoke|QQNTEngineEndToEnd)$") -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err -Wait -PassThru
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "ctest failed with exit code $($process.ExitCode)"
          }

      - name: Test Windows native desktop dialogs
        shell: pwsh
        env:
          QTNETWORKCHAT_TEST_FONT: ${{ github.workspace }}/build/ci-fonts/NotoSansCJKsc-Regular.otf
        run: ctest --test-dir build -C Release --output-on-failure -R '^NativeDesktopDialogs$'

      - name: Upload GUI smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-gui-smoke-screenshots
          path: |
            build/Release/login_window_*.png
            build/Release/group_info_panel_*.png
            build/Release/mainwindow_workflow_*.png
            build/Release/mainwindow_*gui.png
          if-no-files-found: ignore

      - name: Install Inno Setup
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1 -BuildDir build -Configuration Release -PackageDir dist

      - name: Smoke test Windows installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Get-ChildItem -LiteralPath dist -Filter "*-setup.exe" -File | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP "QtNetworkChat-smoke"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          foreach ($name in @("QtNetworkChat.exe", "Qt6WebSockets.dll", "libcrypto-3-x64.dll", "MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $name) -PathType Leaf)) { throw "Installed runtime missing $name" }
          }
          $env:QTNETWORKCHAT_SERVER_HOST = "127.0.0.1"
          $env:QTNETWORKCHAT_SERVER_PORT = "1"
          $env:QTNETWORKCHAT_TRANSPORT = "tcp"
          $process = Start-Process -FilePath (Join-Path $installDir "QtNetworkChat.exe") -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Installed client exited early with code $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QtNetworkChat-win-x64
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist/*-setup.exe).FullName --clobber

      - name: Upload CI diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          path: |
            build/ci-logs/
            build/Testing/
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: |
          $summary = @()
          $summary += "## QtNetworkChat Windows Build"
          $summary += ""
          $summary += "| Field | Value |"
          $summary += "|---|---|"
          $summary += "| Commit | `$env:GITHUB_SHA` |"
          $summary += "| Event | `$env:GITHUB_EVENT_NAME` |"
          $summary += "| Ref | `$env:GITHUB_REF` |"
          $summary += "| Qt | `6.8.3 MSVC 2022 x64` |"
          $summary += "| Build step timeout | `30m` |"
          $summary += "| CTest step timeout | `20m` |"
          $summary += ""
          $summary += "Diagnostics are uploaded as `windows-build-diagnostics` when the job fails or is cancelled."
          $summary -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
