name: Linux Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            cmake \
            desktop-file-utils \
            fonts-noto-cjk \
            libpq-dev \
            libssl-dev \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-websockets-dev \
            xvfb

      - name: Validate Linux packaging metadata
        run: |
          bash -n scripts/package-linux-deb.sh
          desktop-file-validate packaging/linux/io.github.ziyue67.qtnetworkchat.desktop
          appstreamcli validate --pedantic packaging/linux/io.github.ziyue67.qtnetworkchat.metainfo.xml

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQTNETWORKCHAT_DEFAULT_SERVER_HOST=qt.ziyuexc.top \
            -DQTNETWORKCHAT_DEFAULT_SERVER_PORT=443 \
            -DQTNETWORKCHAT_DEFAULT_TRANSPORT=wss \
            -DQTNETWORKCHAT_DEFAULT_WEBSOCKET_PATH=/ws \
            -DQTNETWORKCHAT_DEFAULT_TLS=ON \
            -DQTNETWORKCHAT_DEFAULT_TLS_VERIFY=ON \
            -DQTNETWORKCHAT_E2E_ENABLE_PRODUCTION_CRYPTO=ON \
            -DQTNETWORKCHAT_E2E_LINK_PRODUCTION_ADAPTER=ON

      - name: Build deliverables and focused tests
        run: |
          cmake --build build --parallel --target \
            QtNetworkChat \
            qqnt_server \
            qqnt_engine \
            qqnt_engine_smoke_test \
            message_serialization_test \
            tls_security_test \
            websocket_transport_test \
            login_window_gui_test \
            group_info_panel_ui_test \
            account_password_kdf_test \
            offline_attachment_quota_test \
            file_chunk_duplicate_ack_test \
            file_transfer_cancel_test \
            e2e_production_adapter_runtime_test

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(QtNetworkChatExecutableExists|MessageSerializationRoundTrip|TlsSecurityPinning|WebSocketTransport|LoginWindowGuiInteraction|GroupInfoPanelUiInteraction|AccountPasswordKdfMigration|OfflineAttachmentQuota|FileChunkDuplicateAckProtocol|FileTransferCancelProtocol|E2EProductionAdapterRuntime|QQNTEngineSmoke)$'

      - name: Upload GUI smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-gui-smoke-screenshots
          path: |
            build/login_window_*.png
            build/group_info_panel_*.png
          if-no-files-found: ignore

      - name: Package Linux client
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -nE 's/^project\(QtNetworkChat VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          bash scripts/package-linux-deb.sh build dist "$version"
          dpkg-deb --info "dist/QtNetworkChat-$version-linux-amd64.deb"
          dpkg-deb --contents "dist/QtNetworkChat-$version-linux-amd64.deb"

      - name: Smoke test Linux deb
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get install -y ./dist/*.deb
          set +e
          timeout 10 xvfb-run -a env \
            QT_QPA_PLATFORM=xcb \
            QTNETWORKCHAT_SERVER_HOST=127.0.0.1 \
            QTNETWORKCHAT_SERVER_PORT=1 \
            QTNETWORKCHAT_TRANSPORT=tcp \
            QtNetworkChat
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload Linux package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QtNetworkChat-linux-amd64
          path: dist/*.deb
          if-no-files-found: error

      - name: Attach Linux package to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
